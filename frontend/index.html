<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-icon.png" />
    <link rel="apple-touch-icon" href="/brand-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT 学习工作台</title>
    <script>
      // 首帧前应用主题，避免闪烁
      ;(function () {
        try {
          var s = localStorage.getItem('learnhub-theme')
          var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
