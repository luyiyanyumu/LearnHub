# 前端容器（nginx）的站点配置。
#
# 关键就一条：/api 必须反代到后端容器（服务名 backend，容器内端口 18080）。
# 不配这一条的话，浏览器请求 /api/... 会打到 nginx 自己，整站接口 404。
#
# 为什么 upstream 走变量而不是写死 `proxy_pass http://backend:18080;`：
#   写死主机名时 nginx 在**启动那一刻**解析它，解析不到就直接 emerg 退出 ——
#   实测踩过：单独重启前端容器（后端此刻不在它的解析视图里）时，
#   `nginx: [emerg] host not found in upstream "backend"`，容器反复重启。
#   改用变量后解析推迟到**请求时**，并用 Docker 内置 DNS（127.0.0.11）：
#     · 后端没起来 → 该请求 502，nginx 本身健康（可诊断，而不是整个站点消失）
#     · 后端重启换了 IP → 立刻用新 IP（写死 upstream 的话 nginx 会一直打到旧 IP）
#   注意：`proxy_pass` 里带变量时 nginx 不再自动拼路径，所以用 $api_upstream+$request_uri 显式拼。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：前端产物里最大的是 md-editor / element-plus 那几个 chunk
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    # pdfjs 等库的 worker 是 .mjs（ES 模块）：基础镜像的 mime.types 里没有 mjs，
    # 会被当成 application/octet-stream，浏览器于是拒绝动态 import ——
    # 现象是「资料库 → 阅读 → 原文」一片空白，提示 "Failed to fetch dynamically imported module"。
    # 这是部署层的问题：开发时用 vite dev server，MIME 正确，所以一直没暴露。
    # 正则 location 优先级高于上面的 /assets/ 前缀，于是 .mjs 走这条、其余静态资源照旧。
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端是 history 路由：刷新子路径时文件不存在，回 index.html 交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 变量形式 = 请求时解析（见文件头注释）
        set $api_upstream "http://backend:18080";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 智能体推理 / 翻译是长请求（思考型模型单次可 3 分钟+），默认 60s 会 502
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 与后端 multipart 上限对齐：单文件 50MB、请求 60MB（backend/application.yml）
        client_max_body_size 60m;
    }
}
